name: CI-CD

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Build, Test & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore SmallTodoApi.sln

      - name: Build
        run: dotnet build SmallTodoApi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SmallTodoApi.sln --configuration Release --no-build --verbosity normal

      - name: Code quality - format check
        run: dotnet format SmallTodoApi.sln --verify-no-changes --no-restore

      - name: Code quality - vulnerable packages
        run: dotnet list SmallTodoApi.sln package --vulnerable --include-transitive

  docker:
    name: Build & Publish Docker Image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/smalltodoapi
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
